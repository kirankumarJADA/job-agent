<!doctype html>
<html>
<head><title>Apply for Java Platform Engineer at Pipeline Corp</title></head>
<body>
<div id="application">
  <form id="application_form" action="/monzo/jobs/8200681" method="post" enctype="multipart/form-data">
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="first_name-label" for="first_name" class="label">First name<span>*</span></label>
      <input id="first_name" class="input" type="text" autocomplete="given-name"/>
    </div>
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="last_name-label" for="last_name" class="label">Last name<span>*</span></label>
      <input id="last_name" class="input" type="text" autocomplete="family-name"/>
    </div>
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="email-label" for="email" class="label">Email address<span>*</span></label>
      <input id="email" class="input" type="text" autocomplete="email"/>
    </div>
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="phone-label" for="phone" class="label">Phone<span>*</span></label>
      <input id="phone" class="input" type="tel" aria-label="Phone"/>
    </div>
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="country-label" for="country" class="label select__label">Country of residence<span>*</span></label>
      <input id="country" class="select__input" type="text" role="combobox"/>
    </div>
    <div class="field">
      <label id="candidate-location-label" for="candidate-location" class="label select__label">Current location</label>
      <input id="candidate-location" class="select__input" type="text"/>
    </div>
    <div class="field upload">
      <label class="visually-hidden" for="resume">Attach resume</label>
      <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"/>
    </div>
    <div class="field upload">
      <label class="visually-hidden" for="cover_letter">Attach cover letter</label>
      <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"/>
    </div>
    <div class="field">
      <input class="remix-css-1a0ro4n-requiredInput" required="" aria-hidden="true" tabindex="-1" value=""/>
      <label id="question_123456-label" for="question_123456" class="label">Why do you want to work at Pipeline Corp?<span>*</span></label>
      <textarea id="question_123456" class="textarea"></textarea>
    </div>
    <div class="field">
      <label id="question_654321-label" for="question_654321" class="label">How did you hear about us?</label>
      <input id="question_654321" class="input" type="text"/>
    </div>
    <div class="field">
      <label id="work_auth-label" for="work_auth" class="label select__label">Are you legally authorized to work in the UK?<span>*</span></label>
      <select id="work_auth" class="select">
        <option value=""></option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="field">
      <label class="label">Employment type<span>*</span></label>
      <input id="emp_full" type="radio" name="employment_type" value="FULL_TIME"/><label for="emp_full">Full-time</label>
      <input id="emp_part" type="radio" name="employment_type" value="PART_TIME"/><label for="emp_part">Part-time</label>
    </div>
    <div class="field">
      <label id="relocate-label" for="relocate" class="label checkbox__label">Willing to relocate</label>
      <input id="relocate" type="checkbox" value="yes"/>
    </div>
    <div class="field">
      <label id="portfolio-label" for="portfolio" class="label">Portfolio URL</label>
      <input id="portfolio" class="input" type="text"/>
    </div>
    <button type="submit" class="btn">Submit Application</button>
  </form>
</div>
</body>
</html>
