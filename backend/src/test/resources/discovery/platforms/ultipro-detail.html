anning.\u003c/li\u003e\n\u003cli\u003eEvaluate and continually improve the systems and processes used by the department to effectively meet customer requirements and profitability goals with an emphasis on strong internal unit tracking methods.\u003c/li\u003e\n\u003cli\u003eManage, mentor, and develop colleagues.\u003c/li\u003e\n\u003cli\u003eEnsure schedule requirements are met. Readily adjust priorities and milestones based upon changing customer needs, resource availability, and job requirements.\u003c/li\u003e\n\u003cli\u003eInteract with the customer to validate expectations are understood and met before, during, and after project completion.\u003c/li\u003e\n\u003cli\u003eProvide close support and oversight for third-party construction firms and subcontractors.\u003c/li\u003e\n\u003cli\u003eManage project review process with particular emphasis on financial forecasting.\u003c/li\u003e\n\u003cli\u003eEnsure high-quality engineering, studies, and Helix project delivery.\u003c/li\u003e\n\u003cli\u003eProactively and systematically communicate challenges, risks, and successes.\u003c/li\u003e\n\u003cli\u003eOversee monthly invoicing process per project terms and negotiate appropriate change orders.\u003c/li\u003e\n\u003cli\u003eCoordination with Site Superintendent(s) to understand and assess installation methods, labor needs, and manpower forecasts.\u003c/li\u003e\n\u003cli\u003eClose support and oversight on adherence to the Quality Control process.\u003c/li\u003e\n\u003cli\u003eClose support to ensure that all downstream team members are meeting deadlines on assigned tasks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eQUALIFICATIONS:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMinimum 3 years of project engineer experience in heavy commercial/private electrical construction.\u003c/li\u003e\n\u003cli\u003eUnderstand engineering in electric power.\u003c/li\u003e\n\u003cli\u003eField experience coordinating with construction management.\u003c/li\u003e\n\u003cli\u0
