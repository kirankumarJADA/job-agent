spring:
  application:
    name: job-agent-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobagent}
    username: ${SPRING_DATASOURCE_USERNAME:jobagent}
    password: ${SPRING_DATASOURCE_PASSWORD:jobagent_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate   # schema owned by Flyway, never by Hibernate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Always execute V001 first on a clean database; baseline-on-migrate can
    # incorrectly skip V001 when only an empty Flyway history table exists.
    baseline-on-migrate: false
    # The guarded FlywayMigrationStrategy baselines only an empty or
    # extension-only bootstrap schema at version 0, allowing V001 to run.
    # It also recovers the known lone-invalid-baseline state. Unexpected
    # populated schemas fail closed.
    baseline-version: 0

    placeholders:
      # V024 neutralizes the seeded development credential (dev@example.local,
      # whose password is published in V003's comment) unless a deployment says
      # it is local development. The default is the secure one on purpose: a
      # fresh, unknown, misspelled or future profile is treated as production
      # and loses the published credential. Only application-local.yml opts out
      # so that local development keeps a working seeded login for local
      # inspection mode (frontend/src/localInspection.ts).
      # V024 refuses to run if this value is missing or is not true/false.
      remove_seed_dev_account: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # Upstash's token is the Redis password. Keep the standard Spring
      # property fallback available while supporting the hosted env name.
      password: ${SPRING_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      ssl:
        # Canonical Spring Boot env name wins; retain the existing hosted
        # alias for Render compatibility.
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:${SPRING_REDIS_SSL:false}}
      # Bound the Lettuce client so a slow or hung external Redis fails fast
      # instead of blocking for the 60s client default. These must stay below
      # the post-startup diagnostic's pooled budget (3s) so the diagnostic
      # reports the client's own failure rather than its own budget firing.
      # Override with SPRING_DATA_REDIS_TIMEOUT / SPRING_DATA_REDIS_CONNECT_TIMEOUT
      # if a slower endpoint ever requires it.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  # Gmail TRACK integration. Explicit environment mappings are required because
  # the Java beans read app.gmail.* properties rather than raw GMAIL_* variables.
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:}
    token-key: ${APP_GMAIL_TOKEN_KEY:}
    state-secret: ${APP_GMAIL_STATE_SECRET:}
    lookback-days: ${APP_GMAIL_LOOKBACK_DAYS:90}
  secrets:
    # AES-256-GCM key (base64 32 bytes preferred: `openssl rand -base64 32`)
    # for employer portal credentials and Robin-managed mail content at rest.
    # Blank keeps both features fail-closed: nothing is stored unencrypted.
    encryption-key: ${APP_SECRETS_KEY:}
  # Phase 8.5: Robin-managed email (receive-only) for employer registrations and
  # verification codes. Inactive until the domain, the inbound provider's
  # webhook signing key and APP_SECRETS_KEY are all set AND a signed delivery
  # has been received for the domain (see docs/ROBIN_BUILD_STATUS.md).
  managed-mail:
    # A (sub)domain the operator owns whose MX records point at the provider,
    # e.g. mail.robin.example. Dedicated to receiving; never used to send.
    domain: ${APP_MANAGED_MAIL_DOMAIN:}
    provider: ${APP_MANAGED_MAIL_PROVIDER:mailgun}
    # Encrypted content is erased after this long (and at first use).
    content-retention-minutes: ${APP_MANAGED_MAIL_CONTENT_RETENTION_MINUTES:120}
    # Message metadata (sender, redacted subject, times) is deleted after this.
    metadata-retention-days: ${APP_MANAGED_MAIL_METADATA_RETENTION_DAYS:30}
    mailgun:
      # Mailgun "HTTP webhook signing key" (Settings → API Security). Not the API key.
      webhook-signing-key: ${MAILGUN_WEBHOOK_SIGNING_KEY:}
      # Signed requests older than this are refused (406); accepted tokens are
      # remembered for twice this long so a captured request cannot be replayed.
      max-age-seconds: ${MAILGUN_WEBHOOK_MAX_AGE_SECONDS:900}
  mailbox-verification:
    # How old a verification message may be when the worker asks for it.
    window-minutes: ${APP_MAILBOX_VERIFICATION_WINDOW_MINUTES:30}
  redis:
    # Cold TLS handshakes can exceed the command timeout. This only bounds
    # Lettuce connection initialization; command execution remains 2s.
    connection-initialization-timeout: ${APP_REDIS_CONNECTION_INITIALIZATION_TIMEOUT:10s}
  discovery:
    comparison-conflict-threshold: ${DISCOVERY_COMPARISON_CONFLICT_THRESHOLD:0.20}
    primary-confidence-threshold: ${DISCOVERY_PRIMARY_CONFIDENCE_THRESHOLD:0.60}
    secondary-priority: ${DISCOVERY_SECONDARY_PRIORITY:firecrawl,apify,browserless,scraperapi,scrapingbee}
  # Machine-to-machine token for worker -> backend event/claim calls.
  # Blank (default) keeps the current local behavior: the endpoints require
  # an authenticated browser session exactly as before. When set, POSTs to
  # /api/v1/automation/events must present `Authorization: Bearer <token>`.
  worker-event-token: ${WORKER_EVENT_TOKEN:}
  # ── Authentication ────────────────────────────────────────────────
  # Firebase Authentication (signup / sign-in / password reset).
  #
  # These are the ONLY values the backend needs from Firebase, and they are
  # supplied exclusively as environment variables — there are no committed
  # defaults, so a deployment that has not been given credentials reports
  # exactly which variables are missing instead of starting up a verifier
  # that cannot work. See FirebaseProperties / FirebaseAdminTokenVerifier.
  #
  # `private-key` is the service-account PEM from the Firebase console
  # (Project settings -> Service accounts -> Generate new private key). In an
  # environment variable its newlines are usually escaped as \n, which is
  # accepted.
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
  auth:
    # When true, creating a NEW account requires the invite code below.
    # Local development defaults to false so the sign-up flow can be exercised
    # without a shared secret; the prod profile flips this to true, which means
    # a production deploy that has not set APP_REGISTRATION_INVITE_CODE
    # refuses new registrations outright (fail closed) rather than becoming
    # open registration. Existing accounts can always sign in either way.
    require-invite-code: ${APP_REQUIRE_INVITE_CODE:false}
    registration-invite-code: ${APP_REGISTRATION_INVITE_CODE:}

  # CORS: comma-separated explicit origins (never "*"; credentials are allowed).
  # Local development trusts the loopback dev server by default; the prod
  # profile flips this to false, so production never trusts localhost even if
  # a loopback origin is left behind in APP_CORS_ALLOWED_ORIGINS.
  cors:
    allow-localhost: ${APP_CORS_ALLOW_LOCALHOST:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    # /actuator/info exposes build + git metadata only. Environment properties
    # stay OFF: they can carry datasource URLs and credentials.
    env:
      enabled: false
    git:
      # "simple" = branch, commit id, commit time. Never "full": full mode
      # would also publish git remote URLs and committer identity.
      mode: simple
  endpoint:
    health:
      # Keep the aggregate endpoint useful for unauthenticated platform
      # health checks without exposing contributor details (JDBC metadata,
      # Redis connection details, or exception messages).
      show-components: always
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      nim:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      gemini:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    root: INFO
